# Desde Windows no se puede compilar para iOS: este workflow lo hace en un Mac de GitHub
# en cada push. Compila el código Kotlin para iOS, pasa los tests comunes en el simulador
# y construye la app de Xcode (sin firmar).
name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Tests comunes en el simulador de iPhone
        run: ./gradlew :app:iosSimulatorArm64Test --stacktrace

      - name: Generar el proyecto de Xcode
        run: |
          brew install xcodegen
          cd iosApp && xcodegen

      - name: Construir la app para el simulador
        run: |
          cd iosApp
          xcodebuild -project Yenes.xcodeproj -scheme Yenes -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
